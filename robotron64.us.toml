# N64Recomp config for Robotron 64 (USA) rev 0.
# The symbols file is generated locally by tools/gen_syms.py (ADR 004); run via tools/recomp.sh.

[input]
# _start (ROM 0x1000); N64Recomp renames it to recomp_entrypoint.
entrypoint = 0x80000400

# Paths are relative to the location of this config file.
symbols_file_path = "syms/robotron64.us.syms.toml"
rom_file_path = "baserom.us.z64"
output_func_path = "RecompiledFuncs"

# Enable only when debugging recompilation issues.
# trace_mode = true

[patches]
stubs = []
renamed = []

# libultra internals that are only reachable from functions the runtime reimplements (or from
# each other), so recompiling them would only leave unresolved calls to other libultra
# internals. Call graph checked 2026-10-27; see docs/NOTES.md (Phase 2).
ignored = [
    "func_80064EC8",        # VI manager thread body (osCreateViManager is reimplemented)
    "func_8006E2C4",        # 64DD (leo) interrupt handler
    "func_8006E3AC",        #   its helper
    "func_80068F44",        # __osGetId copy (n64sym), no callers
    "func_800639C4",        # rumble pak helper (osMotor* are reimplemented)
    "func_8006984C",        # __osContRamRead helper
    "func_8006A8A4",        # __osContRamWrite helper
    "func_80062C28",        # osPfsAllocateFile helper
    "func_80062CF0",        # osPfsReadWriteFile helper
    "__osPfsDeclearPage",
    "__osPfsReleasePages",
    "__osBlockSum",
]
