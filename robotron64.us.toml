# N64Recomp config for Robotron 64 (USA) rev 0.
# The symbols file is generated locally by tools/gen_syms.py (ADR 004); run via tools/recomp.sh.

[input]
# _start (ROM 0x1000); N64Recomp renames it to recomp_entrypoint.
entrypoint = 0x80000400

# Paths are relative to the location of this config file.
symbols_file_path = "syms/robotron64.us.syms.toml"
rom_file_path = "baserom.us.z64"
output_func_path = "RecompiledFuncs"

# Enable only when debugging recompilation issues.
# trace_mode = true

[patches]
stubs = []
renamed = []

# libultra internals that are only reachable from functions the runtime reimplements (or from
# each other), so recompiling them would only leave unresolved calls to other libultra
# internals. Call graph checked 2026-10-27; see docs/NOTES.md (Phase 2).
ignored = [
    "func_80064EC8",        # VI manager thread body (osCreateViManager is reimplemented)
    "func_8006E2C4",        # 64DD (leo) interrupt handler
    "func_8006E3AC",        #   its helper
    "func_80068F44",        # __osGetId copy (n64sym), no callers
    "func_800639C4",        # rumble pak helper (osMotor* are reimplemented)
    "func_8006984C",        # __osContRamRead helper
    "func_8006A8A4",        # __osContRamWrite helper
    "func_80062C28",        # osPfsAllocateFile helper
    "func_80062CF0",        # osPfsReadWriteFile helper
    "__osPfsDeclearPage",
    "__osPfsReleasePages",
    "__osBlockSum",
]

# Scheduler startup race (docs/NOTES.md). D_8014BE40, the current frame's profiling slot, stays
# NULL until the retrace thread handles the first VI (decomp src/boot/scheduler.c:79-87). On
# hardware a retrace always arrives before the first task; under the runtime the first graphics or
# audio task can come first, and the scheduler then dereferences NULL. If it is still NULL, point
# it at profiling slot 0 (D_8014B9E0, zeroed BSS), as the first retrace would; the first real
# retrace then advances to slot 1 as usual. The slots only hold timing statistics.
# (A first version waited with yield_self_1ms until the retrace thread set it; that deadlocked at
# game start.) Both hook addresses are branch labels, not delay slots.

# Audio task thread: 0x800509DC is `lw $t6, 0($s5)`, with $s5 = &D_8014BE40.
[[patches.hook]]
func = "func_80050928"
before_vram = 0x800509DC
text = "if (MEM_W(0, ctx->r21) == 0) { MEM_W(0, ctx->r21) = (int32_t)0x8014B9E0; }"

# Music switch busy-wait (decomp src/game/audio_generation.c:61-64, func_80051680):
#   func_80053EBC(id); while (func_80053CC0(id) == 3) { }
# The main thread waits for the audio thread to finish stopping the old music. On hardware the
# audio thread preempts it; the runtime schedules game threads cooperatively, so the loop never
# ends (froze on choosing ONE PLAYER). Yield each iteration so the audio thread can run.
# 0x80051758 is the loop's branch target (`lw $a0, 0($s3)`), not a delay slot.
[[patches.hook]]
func = "func_80051680"
before_vram = 0x80051758
text = "{ void yield_self(uint8_t*); yield_self(rdram); }"

# Audio frame size (decomp src/game/audio_task_build.c, func_800521C8):
#   count = ((D_801901F4 - osAiGetLength() / 4 + D_8008D834) & 0xFFF0) + 0x10
# Real hardware never reports more than the game has submitted, but the runtime reports the host
# audio queue, which can be larger. The subtraction then wraps and count becomes up to 0xFFF0
# frames, overflowing the audio buffers (crashed in the host's queue_samples). Clamp the reported
# length (v0) to what keeps count >= 0x10. Confirmed 2026-10-27 with a logging version of this
# hook: the runtime reported up to 6821 bytes against a limit of 2112.
[[patches.hook]]
func = "func_800521C8"
before_vram = 0x80052218
text = "{ uint32_t lim = ((uint32_t)MEM_W(0, (gpr)(int32_t)0x801901F4) + (uint32_t)MEM_W(0, (gpr)(int32_t)0x8008D834)) * 4; if ((uint32_t)ctx->r2 > lim) { ctx->r2 = lim; } }"

# Background size (decomp src/game/renderer_surfaces/background_dispatch.c:44-50, func_800400D0).
# The background gradient is a 3D quad at Z=32000 with half-extents D_8007CCA8 (X) / D_8007CCAC (Y),
# reset every frame to 19200 x 14400 (or 19200 x 11000), which covers only ~96% of the 4:3 view, and
# RT64's Expand aspect ratio widens the view but not the quad, leaving a box. Scale both extents in
# host code (ultra_extensions.cpp). 0x80040190 is label L_80040190, where both extent-setting paths
# join (not a delay slot); $v0 is live here but untouched.
[[patches.hook]]
func = "func_800400D0"
before_vram = 0x80040190
text = "{ int32_t robotron64_background_extent_x(int32_t); int32_t robotron64_background_extent_y(int32_t); MEM_W(0, (gpr)(int32_t)0x8007CCA8) = robotron64_background_extent_x(MEM_W(0, (gpr)(int32_t)0x8007CCA8)); MEM_W(0, (gpr)(int32_t)0x8007CCAC) = robotron64_background_extent_y(MEM_W(0, (gpr)(int32_t)0x8007CCAC)); }"

# Background distance for very wide windows. The background routines, e.g. func_80040F5C (color_gradient.c)
# and func_80041180 (border_gradient.c) place the quad at Z = 32000 (`addiu rX, $zero, 0x7D00`).
# Past ~2.15:1 the widened X no longer fits in s16, so ultra_extensions.cpp divides X, Y and Z by
# the same factor; these hooks apply it to Z, right after the load (all are plain instructions,
# not delay slots).
[[patches.hook]]
func = "func_80040F5C"
before_vram = 0x800410AC
text = "{ int32_t robotron64_background_z(int32_t); ctx->r12 = (gpr)(int32_t)robotron64_background_z(0x7D00); }"

[[patches.hook]]
func = "func_80041180"
before_vram = 0x80041278
text = "{ int32_t robotron64_background_z(int32_t); ctx->r3 = (gpr)(int32_t)robotron64_background_z(0x7D00); }"

# The other three background routines that read D_8007CCA8/CCAC (found by grepping every load of
# the two globals in RecompiledFuncs). Without these, their quads shrank at very wide windows.
[[patches.hook]]
func = "func_80040BA0"
before_vram = 0x80040DE4
text = "{ int32_t robotron64_background_z(int32_t); ctx->r12 = (gpr)(int32_t)robotron64_background_z(0x7D00); }"

# 0x800418C0 starts a loop that never writes $a0, so resetting it each iteration is harmless.
[[patches.hook]]
func = "func_800414C4"
before_vram = 0x800418C0
text = "{ int32_t robotron64_background_z(int32_t); ctx->r4 = (gpr)(int32_t)robotron64_background_z(0x7D00); }"

[[patches.hook]]
func = "func_80041B24"
before_vram = 0x80041E34
text = "{ int32_t robotron64_background_z(int32_t); ctx->r12 = (gpr)(int32_t)robotron64_background_z(0x7D00); }"

# HUD placement (ultra_extensions.cpp, robotron64_hud_x). The HUD function func_8004B590
# (decomp renderer_text/game_hud.c) places every glyph through func_80049DD8(x, y, z). Switch the
# shifting on at its entry and off at its only return (0x8004BBBC `jr $ra`), so the other caller,
# the status text func_8004B340, is never moved. Hook addresses are function entries or the jr itself.
[[patches.hook]]
func = "func_8004B590"
before_vram = 0x8004B590
text = "{ void robotron64_hud_begin(void); robotron64_hud_begin(); }"

[[patches.hook]]
func = "func_8004B590"
before_vram = 0x8004BBBC
text = "{ void robotron64_hud_end(void); robotron64_hud_end(); }"

[[patches.hook]]
func = "func_80049DD8"
before_vram = 0x80049DD8
text = "{ int32_t robotron64_hud_x(int32_t, int32_t); ctx->r4 = (gpr)(int32_t)robotron64_hud_x((int32_t)ctx->r4, (int32_t)ctx->r5); }"

# Object view culling (widescreen). Three model draw routines (binary fallbacks in the decomp,
# read from its disassembly) skip an object unless, in camera space, z+500 >= 2|x| and
# z+500 >= 2|y|: a fixed square cone that matches the 4:3 view, so objects near the edges of an
# Expand view vanish. Each hook runs right after the abs(x) call returns (the instruction after the
# jal's delay slot, `lw $t3, 0x30($s0)`, followed by `sll $t2, $v0, 1`) and shrinks |x| in v0 by the
# view widening factor (ultra_extensions.cpp). The y and behind-camera checks are unchanged.
[[patches.hook]]
func = "func_8003D43C"
before_vram = 0x8003D5D0
text = "{ int32_t robotron64_cull_abs_x(uint8_t*, int32_t); ctx->r2 = (gpr)(int32_t)robotron64_cull_abs_x(rdram, (int32_t)ctx->r2); }"

[[patches.hook]]
func = "func_8003D7F4"
before_vram = 0x8003D988
text = "{ int32_t robotron64_cull_abs_x(uint8_t*, int32_t); ctx->r2 = (gpr)(int32_t)robotron64_cull_abs_x(rdram, (int32_t)ctx->r2); }"

[[patches.hook]]
func = "func_8003E220"
before_vram = 0x8003E458
text = "{ int32_t robotron64_cull_abs_x(uint8_t*, int32_t); ctx->r2 = (gpr)(int32_t)robotron64_cull_abs_x(rdram, (int32_t)ctx->r2); }"

# Simultaneous two-player (experimental, option Two Player Mode). func_80022528(level, mode, style)
# starts a game (decomp session_scene_start.c); TWO PLAYER passes style 1 (alternating). Style 3 is
# the game's unused simultaneous mode (session_menu_start_alternate.c, unreachable from the menu).
# The hook is at the function entry and rewrites a2.
[[patches.hook]]
func = "func_80022528"
before_vram = 0x80022528
text = "{ int32_t robotron64_two_player_style(int32_t); void robotron64_coop_game_start(int32_t); if ((int32_t)ctx->r5 == 2) { ctx->r6 = (gpr)(int32_t)robotron64_two_player_style((int32_t)ctx->r6); } robotron64_coop_game_start((int32_t)ctx->r6); }"

# Simultaneous two-player fixes for play style 3 (src/game/coop.cpp; each helper returns at once in
# other styles). Addresses checked in RecompiledFuncs; none is a delay slot.
# Menu input: L_80022E90 in the main tick func_80022D24, where the normal and style-3 input sampling join.
[[patches.hook]]
func = "func_80022D24"
before_vram = 0x80022E90
text = "{ void robotron64_coop_merge_input(uint8_t*); robotron64_coop_merge_input(rdram); }"

# Enemy targeting: around the behavior call in the actor update loop func_80029FD8. L_8002A1E8 is
# `lw $t9, 0x5C($s0)` before `jalr $t9` ($s0 = actor); L_8002A1F8 follows the call (also reached
# by a skip branch; the end helper only acts after a begin).
[[patches.hook]]
func = "func_80029FD8"
before_vram = 0x8002A1E8
text = "{ void robotron64_coop_target_begin(uint8_t*, gpr); robotron64_coop_target_begin(rdram, ctx->r16); }"

[[patches.hook]]
func = "func_80029FD8"
before_vram = 0x8002A1F8
text = "{ void robotron64_coop_target_end(uint8_t*); robotron64_coop_target_end(rdram); }"

# Respawn with the wave-start drop-in: 0x80033D80 in the player behavior func_80033974, after the style-3
# revive (decomp player/behavior.c:79-82) has started anim 8 and stored its flags (0x40 cleared, 0x4000
# set at 0x80033D7C), so the 0x40 the helper sets survives. A plain `lui`; $s0 = actor.
[[patches.hook]]
func = "func_80033974"
before_vram = 0x80033D80
text = "{ void robotron64_coop_respawn(uint8_t*, recomp_context*, gpr); robotron64_coop_respawn(rdram, ctx, ctx->r16); }"

# High score for the player who ran out first. L_80033D90 in func_80033974 is style 3's out-of-lives
# branch (decomp player/behavior.c:85; player struct at 0x7C($sp)). 0x800237A0 in func_80022D24 is reached
# only when a high-score entry has finished and nobody has lives left (0x8002379C is the delay slot of the
# branch before it); returning true starts the other player's entry and skips the switch to TOP5.
[[patches.hook]]
func = "func_80033974"
before_vram = 0x80033D90
text = "{ void robotron64_coop_player_out(uint8_t*, int32_t); robotron64_coop_player_out(rdram, MEM_W(0x7C, ctx->r29)); }"

[[patches.hook]]
func = "func_80022D24"
before_vram = 0x800237A0
text = "{ int robotron64_coop_next_entry(uint8_t*); if (robotron64_coop_next_entry(rdram)) { goto L_800255D8; } }"

# Floor ring and aim pose for both players (src/game/coop.cpp). L_80035174 is the epilogue of the player
# behavior func_80033974 that every exit passes ($s0 = actor); 0x8003A990 is the top of the per-object loop
# body in the draw function func_8003A8B0 ($s5 = object index), after the beq/delay slot at 0x8003A988/8C.
[[patches.hook]]
func = "func_80033974"
before_vram = 0x80035174
text = "{ void robotron64_coop_save_aim(uint8_t*, gpr); robotron64_coop_save_aim(rdram, ctx->r16); }"

[[patches.hook]]
func = "func_8003A8B0"
before_vram = 0x8003A990
text = "{ void robotron64_coop_select_object(uint8_t*, int32_t); int robotron64_first_person_hide(int32_t); robotron64_coop_select_object(rdram, (int32_t)ctx->r21); if (robotron64_first_person_hide((int32_t)ctx->r21)) { goto L_8003B20C; } }"

# HUD wave: entry of the HUD state function func_800371FC (decomp game_hud_state.c).
[[patches.hook]]
func = "func_800371FC"
before_vram = 0x800371FC
text = "{ void robotron64_coop_hud_wave(uint8_t*); robotron64_coop_hud_wave(rdram); }"

# Graphics task thread: 0x80050C6C is `lw $t8, 0($s2)`, with $s2 = &D_8014BE40.
[[patches.hook]]
func = "func_80050BD0"
before_vram = 0x80050C6C
text = "if (MEM_W(0, ctx->r18) == 0) { MEM_W(0, ctx->r18) = (int32_t)0x8014B9E0; }"

# First-person camera (option First-Person Camera, src/game/first_person.cpp): the game's finished but
# unused camera view 8 "FIRST". Addresses from the disassembly (build/analysis/cpu); none is a delay slot.
# Cycle: func_8001276C stores the next view at 0x8001286C (sb $v0 to the player's selection05).
[[patches.hook]]
func = "func_8001276C"
before_vram = 0x8001286C
text = "{ void robotron64_camera_cycle(uint8_t*, recomp_context*); robotron64_camera_cycle(rdram, ctx); }"

# HUD camera name: func_800126E0 searches the cycle table, which has no view 8; return the FIRST name.
[[patches.hook]]
func = "func_800126E0"
before_vram = 0x800126E0
text = "{ int32_t robotron64_camera_name(uint8_t*); int32_t name = robotron64_camera_name(rdram); if (name != 0) { ctx->r2 = (gpr)name; return; } }"

# Once per frame at the start of the object draw (the per-object hide is in the 0x8003A990 hook above).
[[patches.hook]]
func = "func_8003A8B0"
before_vram = 0x8003A8B0
text = "{ void robotron64_first_person_frame(uint8_t*); robotron64_first_person_frame(rdram); }"

# Culling |y|: right after the second abs() call in each of the three draw routines (the |x| hooks are
# above), `lw ... 0x30($s0)` followed by `sll $t5, $v0, 1`.
[[patches.hook]]
func = "func_8003D43C"
before_vram = 0x8003D5FC
text = "{ int32_t robotron64_cull_abs_y(uint8_t*, int32_t); ctx->r2 = (gpr)(int32_t)robotron64_cull_abs_y(rdram, (int32_t)ctx->r2); }"

[[patches.hook]]
func = "func_8003D7F4"
before_vram = 0x8003D9B4
text = "{ int32_t robotron64_cull_abs_y(uint8_t*, int32_t); ctx->r2 = (gpr)(int32_t)robotron64_cull_abs_y(rdram, (int32_t)ctx->r2); }"

[[patches.hook]]
func = "func_8003E220"
before_vram = 0x8003E484
text = "{ int32_t robotron64_cull_abs_y(uint8_t*, int32_t); ctx->r2 = (gpr)(int32_t)robotron64_cull_abs_y(rdram, (int32_t)ctx->r2); }"

# Near plane: func_80048DDC stores it (100.0) at sp+0x10 at 0x80048F20 before the perspective call.
[[patches.hook]]
func = "func_80048DDC"
before_vram = 0x80048F24
text = "{ void robotron64_first_person_near(uint8_t*, recomp_context*); robotron64_first_person_near(rdram, ctx); }"
