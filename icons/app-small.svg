<?xml version="1.0" encoding="UTF-8"?>
<!-- App icon, 16-32 px variant of icons/app.svg (grid floor and emblem stripes left out). Fan art drawn
     for this project (see CREDITS.md). Robotron and its characters belong to their owners. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background after the box art: dark navy sky with a purple glow at the top, glowing blue grid floor. -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c1c66"/>
      <stop offset="0.4" stop-color="#141040"/>
      <stop offset="0.6" stop-color="#07071e"/>
    </linearGradient>
    <radialGradient id="headglow" cx="268" cy="70" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e6dcff" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#b49cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8a6ae0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="256" cy="70" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a6ae0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#8a6ae0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="300" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05061a"/>
      <stop offset="1" stop-color="#0a1440"/>
    </linearGradient>
    <linearGradient id="gridfade" x1="0" y1="300" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a9aff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#4a9aff" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="96"/></clipPath>
    <clipPath id="floorclip"><rect y="300" width="512" height="212"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <!-- lamp-like glow behind the robot's head, as on the box art -->
    <rect width="512" height="512" fill="url(#headglow)"/>
    <rect y="300" width="512" height="212" fill="url(#floor)"/>
    <!-- the box art's blue grid floor: lines converging past the horizon, cross lines closer together far away -->
  </g>
  <!-- The robot, faces after the box art: light from the upper left, so each block shows a light top, a
       mid-tone front and a very dark right side. Coordinates are in a 555 x 447 drawing space mapped onto the
       tile. -->
  <g transform="translate(48 44) scale(0.9) translate(-30 -30)">
    <!-- viewer's left arm, held out sideways -->
    <polygon points="62,146 178,96 170,215 72,250" fill="#3e4248"/>
    <polygon points="30,132 62,146 72,250 40,236" fill="#6e7278"/>
    <polygon points="30,132 148,86 178,96 62,146" fill="#e8e8ea"/>
    <!-- hips, in shadow between the legs -->
    <polygon points="200,248 342,242 332,272 210,274" fill="#1c0c12"/>
    <!-- viewer's right leg, nearly upright -->
    <polygon points="358,300 393,296 406,384 373,383" fill="#6f7c72"/>
    <polygon points="292,257 342,257 358,300 373,383 311,380" fill="#93a096"/>
    <polygon points="342,257 368,259 393,296 358,300" fill="#eeeeee"/>
    <!-- right foot: bright front face (wider at the bottom) and a dark right side; the top is hidden -->
    <polygon points="376,384 418,386 417,438 370,447" fill="#2a0608"/>
    <polygon points="291,382 376,384 370,447 278,447" fill="#f0281c"/>
    <!-- viewer's left leg, striding out -->
    <polygon points="233,256 271,257 265,348 245,403 198,348" fill="#3b443d"/>
    <polygon points="196,257 233,256 198,350 143,348 170,281" fill="#f6f6f6"/>
    <!-- left foot: red top, dark front and underside reaching down to the right -->
    <polygon points="86,395 146,397 184,346 198,348 245,403 249,401 246,435 121,425" fill="#1e0a0a"/>
    <polygon points="86,395 128,347 184,346 146,397" fill="#f0281c"/>
    <!-- head: a white block seen from the front, lower corners cut, thin red top, dark side and underside;
         behind the torso -->
    <polygon points="204,76 238,84 325,74 350,74 345,88 240,96 210,88" fill="#2a0608"/>
    <polygon points="341,28 354,42 350,74 325,74 343,56" fill="#3a0c10"/>
    <polygon points="205,50 212,46 338,23 341,28" fill="#d01a1e"/>
    <polygon points="205,50 341,28 343,56 325,74 238,84 204,76" fill="#f4f4f6"/>
    <!-- torso: dark right side, red front -->
    <polygon points="378,78 398,90 355,245 335,250" fill="#2a0608"/>
    <polygon points="160,100 378,78 335,250 205,255" fill="#e3141c"/>
    <!-- chest emblem, abstract (no letter): tilted with the torso; stripes thinning with the perspective -->
    <polygon points="232,121 289,116 290,177 233,180" fill="#ffffff"/>
    <polygon points="244,129 278,126 279,164 244,168" fill="#e3141c"/>
    <polygon points="249,133 273,131 274,160 249,163" fill="#ffffff"/>
    <!-- viewer's right arm, in front of the torso: a long block leaning right as it goes down, big tilted
         square top, wide main face, narrow dark right face -->
    <polygon points="441,157 456,107 481,226 473,284" fill="#4b5650"/>
    <polygon points="381,142 441,157 473,284 446,289" fill="#353f3a"/>
    <polygon points="381,142 403,91 456,107 441,157" fill="#f4f4f4"/>
  </g>
</svg>
